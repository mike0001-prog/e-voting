    {% block body %}{% endblock %}
    <!-- Confirmation Modal -->
<div class="modal fade" id="confirmVoteModal" tabindex="-1" aria-labelledby="confirmVoteModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmVoteModalLabel">Confirm Your Vote</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to vote for <strong id="selected-candidate-name"></strong>?
        <br><small class="text-muted">This action cannot be undone once submitted.</small>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn bg-b" id="confirmVoteBtn">Yes, Cast My Vote</button>
      </div>
    </div>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <script  src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

<script>
  $(function () {
    // card active-class logic (per post group)
    $(document).on("click", ".card-custom", function (e) {
      var $group = $(this).closest(".candidates-group");
      $group.find(".card-custom").removeClass("active");
      $(this).addClass("active");
    });

    // cast vote button flow
    $(document).on("click", "#castVoteBtn", function (e) {
      var $form = $(this).closest("form");
      var $checked = $form.find('input[name="candidate"]:checked');

      if ($checked.length === 0) {
        alert("Please select a candidate before casting your vote.");
        return;
      }

      var candidateName = $checked.closest("label.card").find(".card-title").text().trim();
      $("#selected-candidate-name").text(candidateName);

      $("#confirmVoteModal").data("target-form", $form);
      var modal = new bootstrap.Modal(document.getElementById("confirmVoteModal"));
      modal.show();
    });

    // submit via AJAX once confirmed, then remove the position block
    $(document).on("click", "#confirmVoteBtn", function () {
      var $confirmBtn = $(this);
      var $form = $("#confirmVoteModal").data("target-form");
      var $positionDiv = $form.closest(".position");

      $confirmBtn.prop("disabled", true).text("Submitting...");

      $.ajax({
        url: $form.attr("action"),
        method: "POST",
        data: $form.serialize(),
        success: function (response) {
          var modalEl = document.getElementById("confirmVoteModal");
          bootstrap.Modal.getInstance(modalEl).hide();

          // remove the whole position section (title + candidates + button)
          $positionDiv.fadeOut(300, function () {
            $(this).remove();
          });
        },
        error: function (xhr) {
          alert("Something went wrong submitting your vote. Please try again.");
        },
        complete: function () {
          $confirmBtn.prop("disabled", false).text("Yes, Cast My Vote");
        }
      });
    });
  });
</script>
</body>
</html>
