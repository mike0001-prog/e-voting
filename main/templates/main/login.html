{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Log In</title>
</head>
<body class="sign-in-body">
    <div class="background-animation"></div>
    <form class="sign-in-form p-3" action="{% url 'user_login' %}" method="post">
      {% if form.errors %}
        <!-- <div class="p-3 mb-4 rounded bg-red-100 text-red-800">
            {% for field in form %}
            {% for error in field.errors %}
            <p>{{ error }}</p>
            {% endfor %}
            {% endfor %}
        </div> -->
        {% for error in form.non_field_errors %}
        <div class="p-3 mb-4 rounded bg-red-100 text-red-800">
 {{ error}}
        </div>
           
        {% endfor %}
        {% endif %}
 
        {%csrf_token%}
        <div class="logos-container">
            <!-- <img src="{% static 'logo.png' %}" alt="LASCOCO LOGO"> -->
            <img src="{% static 'src-logo.jpg' %}" alt="LASCOCO SRC LOGO">

        </div>
        <h2>Welcome Back!</h2>
      
        <div class="form-floating mb-3">
  <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required class="form-control" id="floatingInput" placeholder="name@example.com">
  <label for="floatingInput">Matric No.</label>
</div>
<div class="form-floating">
  <input name="password" type="password" class="form-control" id="floatingPassword" placeholder="Password" required>
  <label for="floatingPassword">Password</label>
</div>
       
        <button class="p-2 btn">Log In</button>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</body>
</html>
